<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Form</title>
    </head>

    <body>
        <header>
            <h1>Add new product</h1>
        </header>

        <main>
            <form>
                <div>
                    <label for="full-name">Full name:</label>
                    <input type="text" id="full-name" name="full_name" placeholder="Wprowadź nazwę">
                </div>

                <div>
                    <label for="emali-address">Email address:</label>
                    <input type="text" id="emali-address" name="email_address" placeholder="Wprowadź email">
                </div>
            </form>
        </main>
    </body>
</html>
