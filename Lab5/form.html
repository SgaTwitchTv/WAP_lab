<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  
  <title>Sign in!</title>
</head>
<body class="page-signin">

  <main>
    <form id="signinForm">
      <h1>Sign in!</h1>

      <label for="name">Full name:</label>
      <input id="name" name="name" type="text" placeholder="e.g. John Kowalski"  />

      <label for="email">Email address:</label>
      <input id="email" name="user_email" type="email" placeholder="e.g. kowalski@example.com"/>

      <label for="password">Password:</label>
      <input id="password" name="password" type="password" placeholder="Min. 8 characters"  />
      

      <div class="buttons-layout">
        <button id="submit-button" type="submit">Log in</button>
        <button type="reset">Start over</button>
      </div>
    </form>
  </main>
</body>
</html>
